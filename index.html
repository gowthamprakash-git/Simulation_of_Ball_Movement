<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    #moveableBall{
        border: 2px solid black;
        width: 100px;
        height: 100px;
        border-radius: 50px;
        background-color: lavender;
        position: absolute;
    }

    #reverseBall{
        border: 2px solid black;
        width: 100px;
        height: 100px;
        border-radius: 50px;
        background-color: rgb(30, 30, 211);
        position: absolute;
        top: 200px;
    }
</style>
<body>
    <div id="moveableBall"></div>
    <div id="reverseBall"></div>
</body>
<script src="movingBall.js"></script>
</html>
